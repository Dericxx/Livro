<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3640">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Livro de Notas">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Livro de Notas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@500;600&family=Literata:wght@400;600&display=swap">
<style>
/* Layout: uma página de livro ocupa a tela, barra fixa embaixo, folha que vira em 3D sobre a lombada à esquerda. Fotos, desenho e título da capa são camadas livres sobre a folha. */
:root {
  --desk: #c9cfcc;
  --paper: #f5f1e6;
  --paper-edge: #d8d1bf;
  --ink: #25221c;
  --ink-soft: #8a8474;
  --frame: #fdfcf8;
  --cover: #1b3640;
  --cover-hi: #27505e;
  --foil: #dcb870;
  --btn: #e8ece9;
  --ui-fg: #22302f;
  --accent: #2c7a8c;
  --danger: #a8372f;
  --wood: #7a5638;
  --wood-hi: #9b7550;
  --wood-lo: #4f3724;
  --case: #3a2a1f;
  --case-hi: #523b2b;
  --font-display: 'Gloock', Georgia, serif;
  --font-body: 'Literata', Georgia, serif;
  --font-ui: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #101517;
    --paper: #d9d3c3;
    --paper-edge: #a9a392;
    --ink: #1f1d18;
    --ink-soft: #7a7464;
    --frame: #e8e4d8;
    --cover: #12272f;
    --cover-hi: #1b3b47;
    --foil: #d2ac66;
    --btn: #222b2e;
    --ui-fg: #dfe6e3;
    --accent: #5db0c2;
    --danger: #c4483f;
    --wood: #5e4129;
    --wood-hi: #7a5a3d;
    --wood-lo: #3a281a;
    --case: #241912;
    --case-hi: #34251a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #101517;
  --paper: #d9d3c3;
  --paper-edge: #a9a392;
  --ink: #1f1d18;
  --ink-soft: #7a7464;
  --frame: #e8e4d8;
  --cover: #12272f;
  --cover-hi: #1b3b47;
  --foil: #d2ac66;
  --btn: #222b2e;
  --ui-fg: #dfe6e3;
  --accent: #5db0c2;
  --danger: #c4483f;
  --wood: #5e4129;
  --wood-hi: #7a5a3d;
  --wood-lo: #3a281a;
  --case: #241912;
  --case-hi: #34251a;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--desk);
  color: var(--ui-fg);
  font-family: var(--font-ui);
  overflow-x: clip;
}

.stage { flex: 1; min-height: 0; display: flex; justify-content: center; padding-right: 6px; }
.book { position: relative; width: 100%; max-width: 540px; perspective: 1800px; }

/* Folha de papel */
.sheet {
  position: absolute; inset: 0;
  overflow: hidden;
  background: var(--paper);
  border-radius: 3px 9px 9px 3px;
  box-shadow: 2px 0 0 var(--paper-edge), 4px 1px 0 var(--paper), 5px 1px 0 var(--paper-edge), 0 10px 24px rgba(0, 0, 0, .28);
}
.sheet::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 28px; z-index: 2; pointer-events: none;
  background: linear-gradient(90deg, rgba(0, 0, 0, .18), rgba(0, 0, 0, 0));
}

.content {
  position: absolute; inset: 0;
  box-sizing: border-box;
  padding: 34px 24px 60px 40px;
  overflow-y: auto; overscroll-behavior: contain;
  font-family: var(--font-body); font-size: 18px; line-height: 1.65;
  color: var(--ink);
  outline: none; word-break: break-word;
  -webkit-user-select: text; user-select: text;
}
.content:empty::before { content: attr(data-placeholder); color: var(--ink-soft); pointer-events: none; }

.folio {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
  padding: 22px 0 14px; text-align: center;
  font: 500 11px/1 var(--font-ui); letter-spacing: .16em; color: var(--ink-soft);
  font-variant-numeric: tabular-nums; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--paper) 55%);
}

/* Fotos livres sobre a página */
.layer { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.pimg {
  position: absolute; box-sizing: border-box; padding: 6px;
  background: var(--frame);
  box-shadow: 0 2px 10px rgba(0, 0, 0, .28);
  pointer-events: auto; touch-action: none; cursor: grab;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.pimg img { display: block; width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; user-select: none; }
.pimg.sel { outline: 2px solid var(--accent); cursor: move; }
.pimg.sel::after {
  content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 30px; margin-left: -1px;
  background: var(--accent); pointer-events: none;
}
.handle {
  position: absolute; z-index: 2; width: 18px; height: 18px; margin: -9px;
  border-radius: 50%; background: var(--frame); border: 2px solid var(--accent);
  box-sizing: border-box; touch-action: none; box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
}
.handle::after { content: ""; position: absolute; inset: -12px; }
.handle[data-k="nw"] { left: 0; top: 0; cursor: nwse-resize; }
.handle[data-k="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
.handle[data-k="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
.handle[data-k="sw"] { left: 0; top: 100%; cursor: nesw-resize; }
.handle.rot { left: 50%; top: calc(100% + 30px); cursor: grab; background: var(--accent); }

/* Desenho */
.draw { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 7; pointer-events: none; }
.drawing .draw { pointer-events: auto; touch-action: none; cursor: crosshair; }
.drawing .content { -webkit-user-select: none; user-select: none; }

/* Capa */
.sheet.cover { background: linear-gradient(140deg, var(--cover-hi), var(--cover)); color: var(--foil); }
.sheet.cover::after {
  content: ""; position: absolute; inset: 14px 14px 14px 36px; z-index: 1; pointer-events: none;
  border: 1px solid var(--foil); border-radius: 2px; opacity: .75;
}
.cover-frame {
  position: absolute; inset: 34px 32px 34px 56px; z-index: 3; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
}
.cover-kicker { font: 600 11px/1 var(--font-ui); letter-spacing: .26em; text-transform: uppercase; }
.cover-foot { font: 500 12px/1 var(--font-ui); letter-spacing: .12em; opacity: .75; font-variant-numeric: tabular-nums; }
.title-box { position: absolute; z-index: 6; width: 76%; pointer-events: auto; }
.cover-title {
  font-family: var(--font-display); font-size: 40px; line-height: 1.1; text-wrap: balance;
  outline: none; word-break: break-word; min-height: 1.1em;
  text-shadow: 0 1px 6px rgba(0, 0, 0, .35);
}
.cover-title:empty::before { content: attr(data-placeholder); color: color-mix(in srgb, var(--foil) 45%, transparent); }
.cover-rule { width: 56px; height: 2px; margin-top: 20px; background: var(--foil); }
.grip {
  position: absolute; left: -6px; top: -38px; width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--foil); color: var(--cover);
  box-shadow: 0 2px 6px rgba(0, 0, 0, .4); touch-action: none; cursor: grab;
}
.grip::after { content: ""; position: absolute; inset: -8px; }
.grip svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.drawing .title-box, .drawing .pimg, .drawing .grip { pointer-events: none; }

/* Folha que vira */
.leaf {
  position: absolute; inset: 0; z-index: 5;
  transform-origin: left center; transform-style: preserve-3d;
  transition: transform .8s cubic-bezier(.45, .05, .25, 1);
  will-change: transform;
}
.face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.leaf .sheet.face { box-shadow: 0 6px 18px rgba(0, 0, 0, .3); }
.face.back {
  transform: rotateY(180deg);
  border-radius: 3px 9px 9px 3px;
  background: linear-gradient(90deg, rgba(0, 0, 0, .14), rgba(0, 0, 0, 0) 40px), var(--paper);
}

/* Botão de som, etiqueta de leitura, aviso */
.snd {
  position: absolute; top: 6px; right: 6px; z-index: 7;
  width: 34px; height: 34px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 0; border-radius: 50%; cursor: pointer;
  background: color-mix(in srgb, var(--btn) 88%, transparent); color: var(--ui-fg);
  -webkit-tap-highlight-color: transparent;
}
.snd svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.snd[aria-pressed="false"] .on { display: none; }
.snd[aria-pressed="true"] .off { display: none; }
.readtag {
  position: absolute; top: 8px; left: 82px; z-index: 7; max-width: calc(100% - 140px);
  padding: 7px 11px; border-radius: 999px;
  background: var(--ui-fg); color: var(--btn);
  font: 600 12px/1 var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.toast {
  position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 30; transform: translateX(-50%);
  width: max-content; max-width: 90%; padding: 10px 14px; border-radius: 10px;
  background: var(--ui-fg); color: var(--btn);
  font: 600 13px/1.35 var(--font-ui); text-align: center;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
}

/* Barra de ferramentas */
.dock { height: 88px; display: flex; flex-direction: column; justify-content: center; }
.bar { display: flex; gap: 6px; }
.bar button, .imgbar button {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  min-height: 54px;
  border: 0; border-radius: 10px;
  background: var(--btn); color: var(--ui-fg);
  font: 600 11px/1 var(--font-ui); letter-spacing: .02em;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.bar button.arrow { flex: .55; }
.bar button:disabled { opacity: .35; cursor: default; }
.bar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible, .content:focus-visible, .cover-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cover-title:focus-visible { outline-color: var(--foil); }

.imgbar {
  position: absolute; left: 50%; bottom: 14px; z-index: 6; transform: translateX(-50%);
  display: flex; gap: 6px; padding: 6px;
  background: var(--btn); border-radius: 14px; box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
}
.imgbar button { flex: none; flex-direction: row; min-height: 40px; padding: 0 14px; background: var(--desk); font-size: 13px; white-space: nowrap; }
.imgbar button.rm { background: var(--danger); color: #fff; }

/* Barra do desenho */
.drawbar { display: flex; flex-direction: column; gap: 6px; }
.drow { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.swatch {
  flex: none; width: 34px; height: 34px; padding: 0; border-radius: 50%; cursor: pointer;
  border: 2px solid color-mix(in srgb, var(--ui-fg) 30%, transparent); background: var(--c);
  -webkit-tap-highlight-color: transparent;
}
.swatch[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
.tbtn {
  flex: 1; min-width: 0; min-height: 40px; padding: 0 4px;
  display: flex; align-items: center; justify-content: center;
  border: 0; border-radius: 10px; cursor: pointer;
  background: var(--btn); color: var(--ui-fg);
  font: 600 12px/1 var(--font-ui); -webkit-tap-highlight-color: transparent;
}
.tbtn[aria-pressed="true"] { outline: 2px solid var(--accent); background: var(--desk); }
.tbtn .dot { display: block; border-radius: 50%; background: var(--ui-fg); }
.tbtn.done { background: var(--ui-fg); color: var(--btn); }
.tbtn.armed { background: var(--danger); color: #fff; }

/* Menu Mais */
.menu {
  position: absolute; left: 50%; bottom: 12px; z-index: 8; transform: translateX(-50%);
  width: min(88%, 330px); display: flex; flex-direction: column; gap: 4px; padding: 8px;
  background: var(--btn); border-radius: 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, .4);
}
.menu button {
  min-height: 46px; padding: 0 14px; border: 0; border-radius: 10px; text-align: left; cursor: pointer;
  background: var(--desk); color: var(--ui-fg); font: 600 14px/1.2 var(--font-ui);
}
.menu button.armed { background: var(--danger); color: #fff; }

/* Estante */
.shelfbtn { left: 40px; right: auto; }
.shelfwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.shelfhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-inline: 2px; }
.shelfhead h1 { margin: 0; font: 400 26px/1.1 var(--font-display); text-wrap: balance; }
.shelfhead p { margin: 4px 0 0; max-width: 28ch; font-size: 12.5px; line-height: 1.35; color: color-mix(in srgb, var(--ui-fg) 72%, transparent); }
.shelfhead button {
  flex: none; min-height: 40px; padding: 0 14px; border: 0; border-radius: 10px; cursor: pointer;
  background: var(--btn); color: var(--ui-fg); font: 600 12px/1 var(--font-ui);
}
.shelf {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  box-sizing: border-box; padding: 14px 12px 10px;
  display: flex; flex-direction: column; gap: 0;
  background: linear-gradient(180deg, var(--case-hi), var(--case) 60%);
  border: 10px solid var(--wood); border-radius: 8px;
  box-shadow: inset 0 0 22px rgba(0, 0, 0, .55), 0 8px 22px rgba(0, 0, 0, .28);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.srow { flex: none; }
.sbooks { height: 196px; display: flex; align-items: flex-end; gap: 5px; padding: 0 2px; }
.plank {
  height: 14px; margin-inline: -12px;
  background: linear-gradient(180deg, var(--wood-hi), var(--wood) 45%, var(--wood-lo));
  box-shadow: 0 6px 10px rgba(0, 0, 0, .45);
}
.spine {
  position: relative; flex: none; padding: 0; overflow: hidden; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border: 0; border-radius: 3px 3px 1px 1px;
  background: linear-gradient(90deg, var(--b), var(--bh) 35%, var(--b) 72%, rgba(0, 0, 0, .28) 100%), var(--b);
  box-shadow: inset -2px 0 3px rgba(0, 0, 0, .35), inset 2px 0 2px rgba(255, 255, 255, .1), 2px 0 5px rgba(0, 0, 0, .35);
  color: var(--foil); -webkit-tap-highlight-color: transparent;
  transition: transform .15s ease;
}
.spine:active { transform: translateY(-6px); }
.spine .band { position: absolute; left: 0; right: 0; height: 3px; background: var(--foil); opacity: .85; }
.spine .band.top { top: 14px; }
.spine .band.bot { bottom: 14px; }
.spine .st {
  box-sizing: border-box; max-height: calc(100% - 52px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  writing-mode: vertical-rl; transform: rotate(180deg);
  font: 400 15px/1.1 var(--font-display); letter-spacing: .03em; text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
}
.spine .ribbon {
  position: absolute; top: 0; right: 6px; width: 8px; height: 22px; background: var(--foil);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
}
.spine.add {
  background: transparent; box-shadow: none; border: 2px dashed color-mix(in srgb, var(--foil) 70%, transparent);
  border-radius: 4px; color: var(--foil);
}
.spine.add span { font: 400 28px/1 var(--font-display); }
.spine:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stage.enter { animation: enter .35s ease-out; }
@keyframes enter { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }

.sheetbg {
  position: absolute; inset: 0; z-index: 12; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0, 0, 0, .45); border-radius: 8px;
}
.sheetbox {
  box-sizing: border-box; width: 100%; max-width: 420px; margin-bottom: 4px; padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--btn); color: var(--ui-fg); border-radius: 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, .4);
}
.sheettitle { font: 400 20px/1.2 var(--font-display); overflow-wrap: anywhere; }
.swrow { display: flex; flex-wrap: wrap; gap: 8px; }
.csw {
  width: 34px; height: 44px; padding: 0; border: 0; border-radius: 3px; cursor: pointer;
  background: linear-gradient(90deg, var(--b), var(--bh) 40%, var(--b));
  box-shadow: inset -2px 0 3px rgba(0, 0, 0, .35);
}
.csw[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
.sbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.sbtns button {
  flex: 1 1 40%; min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; cursor: pointer;
  background: var(--desk); color: var(--ui-fg); font: 600 13px/1.2 var(--font-ui);
}
.sbtns button.danger { color: var(--danger); }
.sbtns button.armed { background: var(--danger); color: #fff; }

@media (prefers-reduced-motion: reduce) { .leaf { transition-duration: .01s; } .stage.enter { animation: none; } .spine { transition: none; } }
</style>

</head>
<body>
<div class="stage">
  <div class="book" id="book">
    <div class="sheet page" id="page"></div>
    <div class="imgbar" id="imgbar" hidden>
      <button type="button" id="frontBtn">Trazer para frente</button>
      <button type="button" id="rmBtn" class="rm">Remover imagem</button>
    </div>
    <button type="button" class="snd shelfbtn" id="shelfBtn" aria-label="Voltar para a estante">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20V8M9 20V5M13 20V9M17 20l3-11"/></svg>
    </button>
    <div class="readtag" id="readtag" hidden></div>
    <button type="button" class="snd" id="sndBtn" aria-pressed="true" aria-label="Som ao virar a página">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/>
        <g class="on"><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></g>
        <g class="off"><path d="M16 9l5 6M21 9l-5 6"/></g>
      </svg>
    </button>
    <div class="menu" id="menu" hidden></div>
  </div>
</div>

<div class="shelfwrap" id="shelfwrap" hidden>
  <div class="shelfhead">
    <div>
      <h1>Minha estante</h1>
      <p>Toque num livro para abrir. Segure para mudar a cor, duplicar ou apagar.</p>
    </div>
    <button type="button" id="shelfOpen">Abrir arquivo</button>
  </div>
  <div class="shelf" id="shelf"></div>
  <div class="sheetbg" id="sheet" hidden></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<div class="dock">
  <div class="bar" id="bar">
    <button type="button" class="arrow" id="prev" aria-label="Página anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button type="button" id="imgBtn" aria-label="Inserir imagem">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg><span>Imagem</span>
    </button>
    <button type="button" id="drawBtn" aria-label="Desenhar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11a2.1 2.1 0 00-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg><span>Desenhar</span>
    </button>
    <button type="button" id="newBtn" aria-label="Nova página">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Nova</span>
    </button>
    <button type="button" id="moreBtn" aria-label="Mais opções">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Mais</span>
    </button>
    <button type="button" class="arrow" id="next" aria-label="Próxima página">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="drawbar" id="drawbar" hidden>
    <div class="drow">
      <button type="button" class="swatch" data-c="#22201b" style="--c:#22201b" aria-label="Preto" aria-pressed="true"></button>
      <button type="button" class="swatch" data-c="#ffffff" style="--c:#ffffff" aria-label="Branco" aria-pressed="false"></button>
      <button type="button" class="swatch" data-c="#dcb870" style="--c:#dcb870" aria-label="Dourado" aria-pressed="false"></button>
      <button type="button" class="swatch" data-c="#d64545" style="--c:#d64545" aria-label="Vermelho" aria-pressed="false"></button>
      <button type="button" class="swatch" data-c="#2f78c4" style="--c:#2f78c4" aria-label="Azul" aria-pressed="false"></button>
      <button type="button" class="swatch" data-c="#2e9a5b" style="--c:#2e9a5b" aria-label="Verde" aria-pressed="false"></button>
      <button type="button" class="swatch" data-c="#f0a32b" style="--c:#f0a32b" aria-label="Laranja" aria-pressed="false"></button>

    </div>
    <div class="drow">
      <button type="button" class="tbtn sz" data-s="0.004" aria-label="Traço fino" aria-pressed="false"><span class="dot" style="width:4px;height:4px"></span></button>
      <button type="button" class="tbtn sz" data-s="0.009" aria-label="Traço médio" aria-pressed="true"><span class="dot" style="width:8px;height:8px"></span></button>
      <button type="button" class="tbtn sz" data-s="0.022" aria-label="Traço grosso" aria-pressed="false"><span class="dot" style="width:14px;height:14px"></span></button>
      <button type="button" class="tbtn" id="undoBtn">Desfazer</button>
      <button type="button" class="tbtn" id="clearBtn">Limpar</button>
      <button type="button" class="tbtn done" id="doneBtn">Pronto</button>
    </div>
  </div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="openFile" hidden>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var book = $('#book'), pageEl = $('#page'), bar = $('#bar'), drawbar = $('#drawbar');
  var bPrev = $('#prev'), bNext = $('#next'), bImg = $('#imgBtn'), bDraw = $('#drawBtn'), bNew = $('#newBtn'), bMore = $('#moreBtn');
  var file = $('#file'), openFile = $('#openFile'), imgbar = $('#imgbar'), bSnd = $('#sndBtn');
  var menu = $('#menu'), toastEl = $('#toast'), readtag = $('#readtag');

  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function num(v, d, a, b) { v = Number(v); if (!isFinite(v)) v = d; return clamp(v, a, b); }
  function dist(a, b) { return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }
  function ang(a, b) { return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }

  /* ---------- Modelo do livro ---------- */
  function blankPage() { return { t: '', im: [], draw: [] }; }
  /* Cores dos livros: [cor da capa, cor mais clara]. A mesma cor pinta a lombada na estante. */
  var PAL = [
    ['#1b3640', '#27505e'], ['#4a1f2b', '#6a2f3f'], ['#1f3a2b', '#2f5a43'], ['#1d2a4d', '#2c4074'],
    ['#5a3d1c', '#7d5a2e'], ['#3d2447', '#5a3a69'], ['#26282b', '#3d4045'], ['#7a3a24', '#a2573b']
  ];
  function defaultBook() {
    return {
      id: uid(), color: 0, ro: false,
      title: 'Meu livro', cur: 0,
      cover: { tx: 12, ty: 46, im: [], draw: [] },
      pages: [
        {
          t: '<div>Este é o seu livro. Toque aqui e escreva o que quiser.</div><div><br></div><div>Imagem coloca uma foto: arraste para mudar de lugar, puxe as bolinhas dos cantos para o tamanho e use a bolinha de baixo para girar.</div><div><br></div><div>Desenhar deixa você rabiscar na página, e também na capa. Na capa, a alça dourada move o título.</div><div><br></div><div>Em Mais você exporta o livro para outras pessoas abrirem no app. Deslize o dedo para os lados para virar a página.</div>',
          im: [], draw: []
        },
        blankPage()
      ]
    };
  }

  var store = { books: [defaultBook()], view: 'shelf' };
  var state = store.books[0];
  var ready = false;   /* só vira true depois de ler o que está salvo, para não apagar nada por engano */
  function coverVars(el) {
    var c = PAL[state.color] || PAL[0];
    el.style.setProperty('--cover', c[0]);
    el.style.setProperty('--cover-hi', c[1]);
  }
  function readOnly() { return !!state && state.ro === true; }
  function findBook(id) {
    for (var i = 0; i < store.books.length; i++) if (store.books[i].id === id) return store.books[i];
    return null;
  }

  /* ---------- Limpeza de dados (arquivos de outras pessoas são tratados como não confiáveis) ---------- */
  var IMG_RE = /^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+\/=]+$/;
  var COL_RE = /^#[0-9a-fA-F]{6}$/;
  var BLOCK = { div: 1, p: 1, li: 1, h1: 1, h2: 1, h3: 1, h4: 1, h5: 1, h6: 1, blockquote: 1, pre: 1 };
  var SKIP = { script: 1, style: 1, iframe: 1, object: 1, embed: 1, link: 1, meta: 1, template: 1, svg: 1 };

  function cleanText(html) {
    var tpl = document.createElement('template');
    tpl.innerHTML = String(html == null ? '' : html);
    var imgs = [];
    function walk(node) {
      var out = '';
      Array.prototype.forEach.call(node.childNodes, function (n) {
        if (n.nodeType === 3) { out += esc(n.nodeValue); return; }
        if (n.nodeType !== 1) return;
        var tag = n.tagName.toLowerCase();
        if (tag === 'br') out += '<br>';
        else if (tag === 'img') { var s = n.getAttribute('src') || ''; if (IMG_RE.test(s)) imgs.push({ src: s }); }
        else if (SKIP[tag]) { /* descartado */ }
        else if (BLOCK[tag]) out += '<div>' + walk(n) + '</div>';
        else out += walk(n);
      });
      return out;
    }
    return { t: walk(tpl.content), imgs: imgs };
  }

  function cleanImgs(arr) {
    return (Array.isArray(arr) ? arr : []).slice(0, 60).filter(function (it) {
      return it && typeof it.src === 'string' && IMG_RE.test(it.src);
    }).map(function (it) {
      return { id: uid(), src: it.src, x: num(it.x, 10, -50, 150), y: num(it.y, 10, -50, 150), w: num(it.w, 50, 5, 200), r: num(it.r, 0, -360, 360) };
    });
  }

  function cleanDraw(arr) {
    var out = [];
    (Array.isArray(arr) ? arr : []).slice(0, 4000).forEach(function (s) {
      if (!s || !Array.isArray(s.p)) return;
      var p = [];
      for (var i = 0; i < s.p.length && i < 20000; i++) {
        var v = Number(s.p[i]);
        if (!isFinite(v)) return;
        p.push(Math.round(clamp(v, -5, 20) * 10000) / 10000);
      }
      if (p.length < 2) return;
      if (p.length % 2) p.pop();
      out.push({ c: COL_RE.test(String(s.c)) ? String(s.c) : '#22201b', w: num(s.w, 0.009, 0.001, 0.1), e: s.e ? 1 : 0, p: p });
    });
    return out;
  }

  function normalizePage(p) {
    var html, im = [], draw = [];
    if (p && typeof p === 'object') { html = p.t; im = cleanImgs(p.im); draw = cleanDraw(p.draw); } else { html = p; }
    var c = cleanText(html);
    c.imgs.forEach(function (o, k) {
      if (im.length < 60) im.push({ id: uid(), src: o.src, x: Math.min(40, 18 + k * 3), y: Math.min(60, 8 + k * 6), w: 60, r: 0 });
    });
    return { t: c.t.slice(0, 200000), im: im, draw: draw };
  }

  function normalizeBook(raw) {
    raw = raw && typeof raw === 'object' ? raw : {};
    var title = String(raw.title == null ? 'Meu livro' : raw.title).replace(/\s+/g, ' ').slice(0, 60);
    var pages = (Array.isArray(raw.pages) ? raw.pages : []).slice(0, 300).map(normalizePage);
    if (!pages.length) pages.push(blankPage());
    var c = raw.cover && typeof raw.cover === 'object' ? raw.cover : {};
    var cover = { tx: num(c.tx, 12, 0, 24), ty: num(c.ty, 46, 8, 88), im: cleanImgs(c.im), draw: cleanDraw(c.draw) };
    var id = typeof raw.id === 'string' && /^[a-z0-9]{4,20}$/.test(raw.id) ? raw.id : uid();
    var color = Math.floor(Number(raw.color));
    if (!(color >= 0 && color < PAL.length)) color = 0;
    return { id: id, color: color, ro: raw.ro === true, title: title, cur: clamp(Math.floor(Number(raw.cur)) || 0, 0, pages.length), cover: cover, pages: pages };
  }

  /* Aceita o formato novo (vários livros) e os dois formatos antigos (um livro, ou um livro e um lido) */
  function normalizeStore(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var books = [];
    if (Array.isArray(raw.books)) {
      books = raw.books.slice(0, 60).map(normalizeBook);
    } else if (raw.own && typeof raw.own === 'object') {
      books.push(normalizeBook(raw.own));
      if (raw.reading && typeof raw.reading === 'object') {
        var rb = normalizeBook(raw.reading); rb.ro = true; rb.color = 1; books.push(rb);
      }
    } else if (Array.isArray(raw.pages) && raw.pages.length) {
      books.push(normalizeBook(raw));
    } else {
      return null;
    }
    var seen = {};
    books.forEach(function (b) { if (seen[b.id]) b.id = uid(); seen[b.id] = 1; });
    return { books: books, view: 'shelf' };
  }

  /* ---------- Som de virar página ---------- */
  var ac = null, soundOn = true;
  try { soundOn = localStorage.getItem('livro-som') !== '0'; } catch (e) {}
  function syncSnd() { bSnd.setAttribute('aria-pressed', soundOn ? 'true' : 'false'); }
  syncSnd();

  function playFlip() {
    if (!soundOn) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!ac) ac = new AC();
      if (ac.state === 'suspended') ac.resume();
      var t = ac.currentTime, dur = 0.6, n = Math.floor(ac.sampleRate * dur), i;
      var buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
      for (i = 0; i < n; i++) {
        var p = i / n;
        var env = Math.pow(Math.sin(Math.PI * Math.min(1, p * 1.15)), 1.6);
        var crackle = Math.random() < 0.015 ? (Math.random() * 2 - 1) * 1.8 : 0;
        d[i] = ((Math.random() * 2 - 1) * 0.55 + crackle) * env;
      }
      var src = ac.createBufferSource(); src.buffer = buf;
      var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.7;
      bp.frequency.setValueAtTime(700, t);
      bp.frequency.exponentialRampToValueAtTime(3800, t + dur * 0.7);
      var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
      var g = ac.createGain(); g.gain.value = 0.9;
      src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(ac.destination);
      src.start(t);

      var m = Math.floor(ac.sampleRate * 0.07);
      var b2 = ac.createBuffer(1, m, ac.sampleRate), d2 = b2.getChannelData(0);
      for (i = 0; i < m; i++) d2[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / m, 3);
      var s2 = ac.createBufferSource(); s2.buffer = b2;
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      var g2 = ac.createGain(); g2.gain.value = 0.5;
      s2.connect(lp); lp.connect(g2); g2.connect(ac.destination);
      s2.start(t + 0.66);
    } catch (e) {}
  }

  bSnd.addEventListener('click', function () {
    soundOn = !soundOn; syncSnd();
    try { localStorage.setItem('livro-som', soundOn ? '1' : '0'); } catch (e) {}
    if (soundOn) playFlip();
  });

  /* ---------- Aviso rápido ---------- */
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 4200);
  }

  /* ---------- Montagem das páginas ---------- */
  var MOVE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>';

  function curDoc() { return state.cur === 0 ? state.cover : state.pages[state.cur - 1]; }

  function boxHTML(it) {
    return '<div class="pimg" data-id="' + esc(it.id) + '" style="left:' + it.x + '%;top:' + it.y + '%;width:' + it.w + '%;transform:rotate(' + it.r + 'deg)">' +
      '<img src="' + esc(it.src) + '" alt="Imagem da página" draggable="false"></div>';
  }

  function inner(i, editable) {
    var edit = editable && !readOnly();
    var ce = edit ? 'true' : 'false';
    var doc = i === 0 ? state.cover : state.pages[i - 1];
    var layer = '<div class="layer">' + doc.im.map(boxHTML).join('') + '</div>';
    var cv = '<canvas class="draw"></canvas>';
    if (i === 0) {
      var n = state.pages.length;
      return '<div class="cover-frame"><div class="cover-kicker">Caderno</div>' +
        '<div class="cover-foot">' + n + (n === 1 ? ' página' : ' páginas') + '</div></div>' + layer +
        '<div class="title-box" style="left:' + state.cover.tx + '%;top:' + state.cover.ty + '%">' +
        (edit ? '<div class="grip" role="button" aria-label="Mover o título">' + MOVE_ICON + '</div>' : '') +
        '<div class="cover-title" contenteditable="' + ce + '" data-placeholder="Título do livro" spellcheck="false">' + esc(state.title) + '</div>' +
        '<div class="cover-rule"></div></div>' + cv;
    }
    return '<div class="content" contenteditable="' + ce + '" data-placeholder="Comece a escrever…">' + doc.t + '</div>' +
      layer + '<div class="folio">' + i + ' / ' + state.pages.length + '</div>' + cv;
  }

  function render(editable) {
    if (editable === undefined) editable = true;
    pageEl.className = 'sheet page' + (state.cur === 0 ? ' cover' : '') + (drawing ? ' drawing' : '');
    coverVars(pageEl);
    pageEl.innerHTML = inner(state.cur, editable);
    selId = null; imgbar.hidden = true;
    pointers.clear(); gesture = null; tdrag = null; strokeNow = null; drawPid = null;
    paintInto(pageEl, state.cur);
    updateBar();
    updateReadTag();
  }

  function updateReadTag() {
    var ro = readOnly();
    readtag.hidden = !ro;
    if (ro) readtag.textContent = 'Lendo: ' + (state.title || 'sem título');
  }

  function updateBar() {
    var ro = readOnly();
    bPrev.disabled = busy || state.cur === 0;
    bNext.disabled = busy || state.cur === state.pages.length;
    bImg.disabled = busy || ro;
    bDraw.disabled = busy || ro;
    bNew.disabled = busy || ro;
    bMore.disabled = busy;
  }

  function editor() { return pageEl.querySelector('.content'); }

  function commitPage() {
    var c = editor();
    if (c && state.cur > 0 && !readOnly()) state.pages[state.cur - 1].t = c.innerHTML;
    queueSave();
  }

  /* ---------- Armazenamento neste aparelho ---------- */
  function idb() {
    return new Promise(function (res, rej) {
      var q = indexedDB.open('livro-de-notas', 1);
      q.onupgradeneeded = function () { q.result.createObjectStore('kv'); };
      q.onsuccess = function () { res(q.result); };
      q.onerror = function () { rej(q.error); };
    });
  }
  function load() {
    return idb().then(function (d) {
      return new Promise(function (res, rej) {
        var r = d.transaction('kv').objectStore('kv').get('book');
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      });
    }).catch(function () {
      try { return JSON.parse(localStorage.getItem('livro-de-notas') || 'null'); } catch (e) { return null; }
    });
  }
  function persist() {
    if (!ready) return Promise.resolve();
    var snap = JSON.parse(JSON.stringify({ books: store.books }));
    return idb().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(snap, 'book');
        tx.oncomplete = res; tx.onerror = function () { rej(tx.error); };
      });
    }).catch(function () {
      try { localStorage.setItem('livro-de-notas', JSON.stringify(snap)); } catch (e) {}
    });
  }
  var saveTimer = null;
  function queueSave() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 500); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) persist(); });

  /* ---------- Texto ---------- */
  pageEl.addEventListener('input', function (e) {
    if (readOnly()) return;
    var t = e.target.closest ? e.target.closest('.cover-title') : null;
    if (t) { state.title = t.textContent.slice(0, 60); queueSave(); return; }
    var c = editor();
    if (!c) return;
    if (c.innerHTML === '<br>') c.innerHTML = '';
    commitPage();
  });

  pageEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('cover-title')) {
      e.preventDefault(); e.target.blur();
    }
  });

  pageEl.addEventListener('paste', function (e) {
    var host = e.target.closest ? e.target.closest('[contenteditable="true"]') : null;
    if (!host) return;
    e.preventDefault();
    var cd = e.clipboardData;
    var imgs = Array.prototype.filter.call(cd.files || [], function (f) { return f.type.indexOf('image/') === 0; });
    if (imgs.length) { addFiles(imgs); return; }
    var t = cd.getData('text/plain');
    if (host.classList.contains('cover-title')) t = t.replace(/\s+/g, ' ');
    document.execCommand('insertText', false, t);
  });

  /* ---------- Fotos: inserir ---------- */
  function toData(f) {
    return new Promise(function (res) {
      if (!f || f.type.indexOf('image/') !== 0) { res(null); return; }
      var url = URL.createObjectURL(f), img = new Image();
      img.onload = function () {
        var max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function () { URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  }

  function addFiles(list) {
    Array.prototype.slice.call(list).reduce(function (p, f) {
      return p.then(function () { return toData(f).then(function (s) { if (s) insertImage(s); }); });
    }, Promise.resolve());
  }

  function insertImage(src) {
    var doc = curDoc(), layer = pageEl.querySelector('.layer');
    if (busy || readOnly() || !doc || !layer) return;
    var n = doc.im.length;
    var it = { id: uid(), src: src, x: Math.min(40, 20 + n * 3), y: Math.min(60, 10 + n * 6), w: 60, r: 0 };
    doc.im.push(it);
    layer.insertAdjacentHTML('beforeend', boxHTML(it));
    selectImg(it.id);
    queueSave();
  }

  bImg.addEventListener('click', function () { if (!busy && !readOnly()) file.click(); });
  file.addEventListener('change', function () {
    var fs = Array.prototype.slice.call(file.files || []);
    file.value = '';
    addFiles(fs);
  });

  /* ---------- Fotos: selecionar, mover, redimensionar, girar ---------- */
  var selId = null, pointers = new Map(), gesture = null;

  function curItem() {
    var d = curDoc();
    if (!selId || !d) return null;
    for (var k = 0; k < d.im.length; k++) if (d.im[k].id === selId) return d.im[k];
    return null;
  }
  function boxById(id) { return id ? pageEl.querySelector('.pimg[data-id="' + id + '"]') : null; }

  function selectImg(id) {
    var layer = pageEl.querySelector('.layer');
    if (layer) {
      Array.prototype.forEach.call(layer.querySelectorAll('.pimg.sel'), function (b) {
        b.classList.remove('sel');
        Array.prototype.forEach.call(b.querySelectorAll('.handle'), function (h) { h.remove(); });
      });
    }
    selId = id || null;
    var b = boxById(selId);
    if (b) {
      b.classList.add('sel');
      ['nw', 'ne', 'se', 'sw', 'rot'].forEach(function (k) {
        var h = document.createElement('div');
        h.className = 'handle' + (k === 'rot' ? ' rot' : '');
        h.setAttribute('data-k', k);
        b.appendChild(h);
      });
    } else {
      selId = null;
    }
    imgbar.hidden = !selId;
  }

  function applyBox(box, it) {
    box.style.left = it.x + '%';
    box.style.top = it.y + '%';
    box.style.width = it.w + '%';
    box.style.transform = 'rotate(' + it.r + 'deg)';
  }

  function snapRot(r, snap) {
    r = ((r % 360) + 540) % 360 - 180;
    if (snap) {
      var m = Math.round(r / 90) * 90;
      if (Math.abs(r - m) < 4) r = m;
      if (r === 180) r = -180;
    }
    return Math.round(r * 10) / 10;
  }

  function rebase(mode) {
    var it = curItem(), box = boxById(selId);
    if (!it || !box) return;
    var W = pageEl.clientWidth, H = pageEl.clientHeight, r = pageEl.getBoundingClientRect();
    var pts = [];
    pointers.forEach(function (p) { pts.push({ x: p.x - r.left, y: p.y - r.top }); });
    if (!pts.length) return;
    var w = it.w / 100 * W, h = box.offsetHeight, left = it.x / 100 * W, top = it.y / 100 * H;
    var c = { x: left + w / 2, y: top + h / 2 };
    if (pts.length > 1) mode = 'pinch';
    gesture = {
      mode: mode, W: W, H: H, it: it, box: box,
      w0: w, h0: h, cx: c.x, cy: c.y, rot0: it.r,
      p0: pts[0],
      d0: pts[1] ? (dist(pts[0], pts[1]) || 1) : 1,
      a0: pts[1] ? ang(pts[0], pts[1]) : 0,

    if (store.books.length >= 60) { toast('A estante está cheia. Apague um livro para criar outro.'); return; }
    var b = {
      id: uid(), color: store.books.length % PAL.length, ro: false, title: 'Novo livro', cur: 0,
      cover: { tx: 12, ty: 46, im: [], draw: [] }, pages: [blankPage()]
    };
    store.books.push(b);
    openBook(b.id);
    toast('Novo livro criado. Toque no título da capa para dar um nome.');
  }

  /* Folha de opções de um livro (segurar a lombada) */
  var sheetId = null, sheetAt = 0, delArmed = false, delTimer2 = null;
  function closeSheet() { sheetId = null; sheetEl.hidden = true; sheetEl.innerHTML = ''; }
  function openSheet(id) {
    var b = findBook(id);
    if (!b) return;
    sheetId = id; delArmed = false; sheetAt = Date.now();
    toastEl.hidden = true;
    var sw = PAL.map(function (c, i) {
      return '<button type="button" class="csw" data-i="' + i + '" aria-label="Cor ' + (i + 1) + '" aria-pressed="' + (i === b.color) + '" style="--b:' + c[0] + ';--bh:' + c[1] + '"></button>';
    }).join('');
    sheetEl.innerHTML = '<div class="sheetbox" role="dialog" aria-label="Opções do livro">' +
      '<div class="sheettitle">' + esc(b.title || 'Sem título') + (b.ro ? ' (só leitura)' : '') + '</div>' +
      '<div class="swrow">' + sw + '</div>' +
      '<div class="sbtns"><button type="button" data-a="open">Abrir</button><button type="button" data-a="copy">Duplicar</button>' +
      '<button type="button" data-a="del" class="danger">Apagar</button><button type="button" data-a="close">Fechar</button></div></div>';
    sheetEl.hidden = false;
  }

  sheetEl.addEventListener('click', function (e) {
    if (Date.now() - sheetAt < 450) return;
    if (e.target === sheetEl) { closeSheet(); return; }
    var b = findBook(sheetId);
    if (!b) { closeSheet(); return; }
    var sw = e.target.closest('.csw'), btn = e.target.closest('button[data-a]');
    if (sw) { b.color = Number(sw.getAttribute('data-i')) || 0; queueSave(); renderShelf(); openSheet(b.id); sheetAt = 0; return; }
    if (!btn) return;
    var a = btn.getAttribute('data-a');
    if (a === 'open') { openBook(b.id); }
    else if (a === 'close') { closeSheet(); }
    else if (a === 'copy') {
      var c = copyBook(b);
      closeSheet();
      if (c) { renderShelf(); toast('Cópia criada: ' + c.title); }
    } else if (a === 'del') {
      if (!delArmed) {
        delArmed = true; btn.textContent = 'Toque de novo para apagar'; btn.classList.add('armed');
        clearTimeout(delTimer2);
        delTimer2 = setTimeout(function () { delArmed = false; if (btn.isConnected) { btn.textContent = 'Apagar'; btn.classList.remove('armed'); } }, 3000);
        return;
      }
      store.books = store.books.filter(function (x) { return x.id !== b.id; });
      closeSheet(); queueSave(); renderShelf(); toast('Livro apagado.');
    }
  });

  var lp = { t: null, fired: false, x: 0, y: 0 };
  function lpClear() { clearTimeout(lp.t); lp.t = null; }
  shelfEl.addEventListener('pointerdown', function (e) {
    lp.fired = false; lpClear();
    var sp = e.target.closest ? e.target.closest('.spine[data-id]') : null;
    if (!sp || !ready) return;
    lp.x = e.clientX; lp.y = e.clientY;
    var id = sp.getAttribute('data-id');
    lp.t = setTimeout(function () { lp.fired = true; lp.t = null; openSheet(id); }, 480);
  });
  shelfEl.addEventListener('pointermove', function (e) {
    if (lp.t && (Math.abs(e.clientX - lp.x) > 10 || Math.abs(e.clientY - lp.y) > 10)) lpClear();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { shelfEl.addEventListener(n, lpClear); });
  shelfEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  shelfEl.addEventListener('click', function (e) {
    if (lp.fired) { lp.fired = false; return; }
    if (!ready) return;
    var sp = e.target.closest ? e.target.closest('.spine') : null;
    if (!sp) return;
    if (sp.classList.contains('add')) newBook(); else openBook(sp.getAttribute('data-id'));
  });
  $('#shelfOpen').addEventListener('click', function () { if (ready) openFile.click(); });
  bShelf.addEventListener('click', showShelf);
  window.addEventListener('resize', function () { if (!shelfWrap.hidden) renderShelf(); });

  /* ---------- Início ---------- */
  stageEl.hidden = true; dockEl.hidden = true; shelfWrap.hidden = false;
  renderShelf();
  load().then(function (raw) {
    var st2 = normalizeStore(raw);
    if (st2) { store = st2; state = store.books[0] || state; }
  }).then(function () { ready = true; renderShelf(); }, function () { ready = true; renderShelf(); });

  if (window.__LIVRO_TEST) {
    window.__LIVRO_API = {
      cleanText: cleanText, normalizeBook: normalizeBook, normalizeStore: normalizeStore,
      getState: function () { return state; }, getStore: function () { return store; }, readOnly: readOnly,
      importFile: importFile, showShelf: showShelf, openBook: openBook, isReady: function () { return ready; }
    };
  }
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
